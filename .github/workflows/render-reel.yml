name: Render ModusCapsule Reel

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

jobs:
  build-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate reel
        run: |
          python scripts/generate_reel.py

      - name: Upload generated reel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-reel
          path: output/
